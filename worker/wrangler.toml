name = "cloudflare-worker-backend-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "cloudflare-worker-backend-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "fileshare"
database_id = "af9cc20b-4929-43ab-8cde-a62901c4da4a"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "fileshare-bucket"

[env.production.vars]
R2_URL = "https://pub-2c866db421f24cb3b25506636907865d.r2.dev"
FRONTEND_URL = "https://easysharer.pages.dev"
AWS_REGION = "ap-south-1"
RATE_LIMIT_WINDOW_MS = "60000"
RATE_LIMIT_MAX_REQUESTS = "60"
MAX_FILE_SIZE = "10485760"
MAX_FILES_PER_REQUEST = "50"
DEFAULT_CHUNK_SIZE = "1048576"
MAX_CHUNK_SIZE = "5242880"
UPLOAD_SESSION_TIMEOUT_HOURS = "24"
JWT_EXPIRES_IN = "2592000"
RESET_TOKEN_EXPIRES_MINUTES = "15"

[env.production.secrets]
JWT_SECRET = "<REMOVED>" # Removed sensitive JWT secret
AWS_ACCESS_KEY_ID = "<REMOVED>" # Removed AWS access key ID
AWS_SECRET_ACCESS_KEY = "<REMOVED>" # Removed AWS secret access key
SENDER_EMAIL = "<REMOVED>" # Removed sender email